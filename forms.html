<!--Form Tag is essential for collecting user input on web pages. It include interactive text field, emails, password, checkbox, radio button.-->
<!Doctype html>
<html>
    <head>
        <title>Forms Tutorial</title>
    </head>
    <body>
        <h2>HTML Forms</h2>
        <form>  <!--This Form Tag is used to get input from user.-->
            <label for="UserName">Username:</label>
            <!--for attribute links the label to the input field-->
            <input type="text" id="UserName" name="UserName" placeholder="Enter your username"><br><br>
            <!--Here, type defines what kind of input that we store.-->
            <!--id is used to uniquely identify the input field.-->
            <!--name is used to identify the input field when the form is submitted.-->
            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password" placeholder="Enter your password"><br><br>
            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email" placeholder="Enter your email"><br><br>
            <label for="Gender">Enter your Gender Type:</label>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Female">Female</label><br><br>
            <input type="submit" value="Submit">  <!--This Submit button is used to submit the form data to the server.-->

        </form>
    </body>
</html>

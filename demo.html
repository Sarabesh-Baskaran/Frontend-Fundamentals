<!DOCTYPE html>
<html>
    <head>
        <title>Tables Tutorial</title>
    </head>

    <body>
        <!--Tables are used to display data in a tabular form (rows and columns)-->
        <table>  <!--Here table tag is used to create a structure for the table-->
            <!--Header Section-->
            <thead>  <!--It is the header section of the table. It is used for entire header section.-->
                <tr>  <!--It represents table row with opening and closing tags-->
                    <th>S.No</th>  <!--th tag is used for individual header cells.-->
                    <th>Name</th>
                    <th>Age</th>
                </tr>
            </thead>

            <!--Body Section-->

            <tbody>  <!--It is grouping of body data table.-->
                <tr>
                    <td>1</td>  <!--td tag is used for to hold the individual data cells.-->
                    <td>John</td>
                    <td>25</td>
                </tr>



            </tbody>






        </table>
    </body>
</html>
